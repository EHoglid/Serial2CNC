name: Windows EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (major.minor.patch)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Select version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:REQUESTED_VERSION) {
              $version = $env:REQUESTED_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Use a version such as 1.0.0 or tag v1.0.0.'
          }
          "version=$(([version]$version).ToString(3))" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.3 --no-progress -y
      - name: Build EXE installer
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
        run: .\build-installer.ps1 -Version $env:INSTALLER_VERSION
      - name: Verify install and uninstall
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Join-Path $PWD "artifacts\installer\Serial2CNC-$env:INSTALLER_VERSION-win-x64.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Serial2CNC'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path "$installDir\Serial2CNC.exe")) {
              throw 'Desktop installation failed.'
          }
          foreach ($asset in @(
              'wwwroot\Serial2CNC.Web.styles.css',
              'wwwroot\_content\Microsoft.FluentUI.AspNetCore.Components\css\reboot.css'
          )) {
              if (-not (Test-Path (Join-Path $installDir $asset))) {
                  throw "The installed desktop is missing embedded web assets: $asset"
              }
          }
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir\Serial2CNC.exe")) {
              throw 'Desktop uninstallation failed.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Serial2CNC-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Serial2CNC-*-win-x64
          path: installer
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG"; then
            gh release upload "$RELEASE_TAG" installer/*.exe installer/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" installer/*.exe installer/*.sha256 --verify-tag --generate-notes
          fi
