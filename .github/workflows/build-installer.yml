name: Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore GitVersion
        run: dotnet tool restore
      - name: Calculate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/Get-Version.ps1 -Version $env:REQUESTED_VERSION -GitHubOutput
      - name: Install Inno Setup
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed (exit code $LASTEXITCODE)." }
      - name: Build EXE installer
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
        run: .\build-installer.ps1 -Version $env:INSTALLER_VERSION -VersionSuffix $env:INSTALLER_VERSION_SUFFIX
      - name: Verify install and uninstall
        env:
          INSTALLER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Join-Path $PWD "artifacts\installer\Serial2CNC-$env:INSTALLER_VERSION-win-x64.exe"
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Serial2CNC'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path "$installDir\Serial2CNC.exe")) {
              throw 'Desktop installation failed.'
          }
          foreach ($asset in @(
              'wwwroot\Serial2CNC.Web.styles.css',
              'wwwroot\_content\Microsoft.FluentUI.AspNetCore.Components\css\reboot.css'
          )) {
              if (-not (Test-Path (Join-Path $installDir $asset))) {
                  throw "The installed desktop is missing embedded web assets: $asset"
              }
          }
          $uninstall = Start-Process "$installDir\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0 -or (Test-Path "$installDir\Serial2CNC.exe")) {
              throw 'Desktop uninstallation failed.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: Serial2CNC-${{ steps.version.outputs.full_version }}-win-x64
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
          if-no-files-found: error
