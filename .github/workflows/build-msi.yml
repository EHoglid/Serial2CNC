name: Windows MSI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore GitVersion
        run: dotnet tool restore

      - name: Calculate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/Get-Version.ps1 -Version $env:REQUESTED_VERSION -GitHubOutput

      - name: Build MSI
        env:
          MSI_VERSION: ${{ steps.version.outputs.version }}
          MSI_VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
        run: .\build-msi.ps1 -Version $env:MSI_VERSION -VersionSuffix $env:MSI_VERSION_SUFFIX

      - name: Test desktop-only and custom-port server-only installations
        env:
          MSI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $PWD "artifacts\installer\Serial2CNC-$env:MSI_VERSION-win-x64.msi"
          $installDirectory = Join-Path $env:ProgramFiles 'Serial2CNC'
          $desktopExe = Join-Path $installDirectory 'Desktop\Serial2CNC.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Serial2CNC Desktop.lnk'
          foreach ($feature in 'DesktopFeature', 'MainFeature') {
            $installLog = Join-Path $PWD "artifacts\installer\install-$feature.log"
            $uninstallLog = Join-Path $PWD "artifacts\installer\uninstall-$feature.log"
            try {
              $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=$feature WEBPORT=64443 APIPORT=64444 AGENTPORT=64445 /L*v `"$installLog`"" -Wait -PassThru
              if ($install.ExitCode -notin 0, 3010) {
                throw "$feature installation failed with exit code $($install.ExitCode)."
              }
              $services = @(Get-Service -Name 'Serial2CNC.*' -ErrorAction SilentlyContinue)
              if ($feature -eq 'DesktopFeature') {
                if ($services.Count -ne 0 -or -not (Test-Path -LiteralPath $desktopExe) -or
                  -not (Test-Path -LiteralPath $shortcut) -or
                  (Test-Path -LiteralPath (Join-Path $installDirectory 'setup-services.ps1')) -or
                  (Test-Path -LiteralPath 'HKLM:\SOFTWARE\EHoglid\Serial2CNC')) {
                  throw 'Desktop-only installation must include the app and shortcut, without server components.'
                }
                $process = Start-Process -FilePath $desktopExe -WorkingDirectory $env:TEMP -PassThru
                try {
                  if (-not $process.WaitForInputIdle(30000)) { throw 'The desktop app did not become responsive.' }
                  $process.Refresh()
                  if ($process.HasExited -or $process.MainWindowHandle -eq 0) { throw 'The desktop app did not open its window.' }
                } finally {
                  if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
                  $process.Dispose()
                }
              } else {
                if ($services.Count -ne 3 -or (Test-Path -LiteralPath $desktopExe) -or (Test-Path -LiteralPath $shortcut)) {
                  throw 'Server-only installation must include exactly three services and no desktop app or shortcut.'
                }
                $ports = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\EHoglid\Serial2CNC'
                if ($ports.WebPort -ne '64443' -or $ports.ApiPort -ne '64444' -or $ports.AgentPort -ne '64445') {
                  throw 'MSI-selected ports were not persisted.'
                }
                $setup = Join-Path $installDirectory 'setup-services.ps1'
                & $setup
                & $setup
                foreach ($url in 'http://127.0.0.1:64445/health', 'http://127.0.0.1:64444/health', 'https://localhost:64443/health') {
                  if ((Invoke-WebRequest -Uri $url -SkipCertificateCheck -TimeoutSec 5).StatusCode -ne 200) {
                    throw "Custom-port health check failed: $url"
                  }
                }
                $rule = Get-NetFirewallRule -Name 'Serial2CNC-Web-HTTPS' | Get-NetFirewallPortFilter
                if ($rule.LocalPort -ne '64443') { throw 'The firewall does not use the selected Web port.' }
              }
            } finally {
              $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /L*v `"$uninstallLog`"" -Wait -PassThru
              if ($uninstall.ExitCode -notin 0, 3010) { throw "$feature uninstall failed with exit code $($uninstall.ExitCode)." }
            }
            if ((Get-Service -Name 'Serial2CNC.*' -ErrorAction SilentlyContinue) -or
              (Test-Path -LiteralPath $desktopExe) -or (Test-Path -LiteralPath $shortcut)) {
              throw "$feature uninstall left services, desktop executable, or shortcut behind."
            }
          }

      - name: Test install, endpoints, and uninstall
        env:
          MSI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $PWD "artifacts\installer\Serial2CNC-$env:MSI_VERSION-win-x64.msi"
          $installLog = Join-Path $PWD 'artifacts\installer\install.log'
          $uninstallLog = Join-Path $PWD 'artifacts\installer\uninstall.log'
          try {
              $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /L*v `"$installLog`"" -Wait -PassThru
              if ($install.ExitCode -notin 0, 3010) {
                  throw "MSI installation failed (exit code $($install.ExitCode)). See install.log."
              }
                $desktopExe = Join-Path $env:ProgramFiles 'Serial2CNC\Desktop\Serial2CNC.exe'
                if (-not (Test-Path -LiteralPath $desktopExe)) {
                  throw 'The default combined installation must include the WPF desktop application.'
                }
              foreach ($name in 'Serial2CNC.Agent', 'Serial2CNC.Api', 'Serial2CNC.Web') {
                  $service = Get-Service -Name $name -ErrorAction Stop
                  if ($service.Status -ne 'Stopped' -or $service.StartType -ne 'Automatic') {
                      throw "$name must remain stopped until service setup, with automatic startup configured."
                  }
              }
              $installDirectory = Join-Path $env:ProgramFiles 'Serial2CNC'
              $setupScript = Join-Path $installDirectory 'setup-services.ps1'
              & $setupScript
              $dataRoot = Join-Path $env:ProgramData 'Serial2CNC'
              $configPaths = @('Agent', 'Api', 'Web') | ForEach-Object { Join-Path $dataRoot "$_\settings.json" }
              $legacyConfigPaths = @('Agent', 'Api', 'Web') | ForEach-Object { Join-Path $dataRoot "$_\security.json" }
              foreach ($path in $configPaths) {
                  if ((Get-Content -LiteralPath $path -Raw) -match 'ApiKey|ServiceAuthentication') {
                      throw "Obsolete API-key settings remain in $path."
                  }
              }
              if (@($legacyConfigPaths | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) {
                  throw 'Legacy security configuration files were not removed.'
              }
              & $setupScript
              foreach ($path in $configPaths) {
                  if ((Get-Content -LiteralPath $path -Raw) -match 'ApiKey|ServiceAuthentication') {
                      throw "Re-running setup restored API-key settings in $path."
                  }
              }
              if (@($legacyConfigPaths | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) {
                  throw 'Re-running setup restored legacy security configuration files.'
              }
              foreach ($name in 'Serial2CNC.Agent', 'Serial2CNC.Api', 'Serial2CNC.Web') {
                  $service = Get-Service -Name $name
                  $account = (Get-CimInstance Win32_Service -Filter "Name='$name'").StartName
                  if ($service.Status -ne 'Running' -or $account -ine "NT SERVICE\$name") {
                      throw "$name is not running under its isolated virtual account."
                  }
              }
              foreach ($component in 'Agent', 'Api', 'Web') {
                  $serviceSid = ([Security.Principal.NTAccount]"NT SERVICE\Serial2CNC.$component").Translate(
                      [Security.Principal.SecurityIdentifier]).Value
                  $allowedSids = @('S-1-5-18', 'S-1-5-32-544', $serviceSid)
                  $componentDirectory = Join-Path $dataRoot $component
                  if (-not (Get-Acl -LiteralPath $componentDirectory).AreAccessRulesProtected) {
                      throw "$component security directory still inherits broad ACLs."
                  }
                  foreach ($entry in @((Get-Item -LiteralPath $componentDirectory)) +
                      @(Get-ChildItem -LiteralPath $componentDirectory -Recurse -Force)) {
                      foreach ($rule in (Get-Acl -LiteralPath $entry.FullName).Access) {
                          $sid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
                          if ($rule.AccessControlType -eq 'Allow' -and $sid -notin $allowedSids) {
                              throw "$component security data is accessible by an unexpected principal."
                          }
                      }
                  }
              }
              foreach ($url in 'http://127.0.0.1:62904/health', 'http://127.0.0.1:62901/health', 'https://localhost:62899/health') {
                  $response = $null
                  $lastError = $null
                  foreach ($attempt in 1..20) {
                      try {
                          $response = Invoke-WebRequest -Uri $url -TimeoutSec 3 -SkipCertificateCheck
                          break
                      } catch [System.Net.Http.HttpRequestException], [Microsoft.PowerShell.Commands.HttpResponseException] {
                          $lastError = $_
                          Start-Sleep -Seconds 2
                      }
                  }
                  if ($null -eq $response -or $response.StatusCode -ne 200) {
                      throw "Endpoint check failed: $url. $lastError"
                  }
              }
              $css = Invoke-WebRequest 'https://localhost:62899/_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css' -SkipCertificateCheck
              if ($css.Headers['Content-Type'] -notmatch 'text/css') {
                  throw 'The installed Web UI is missing its static assets.'
              }
              foreach ($probe in @(
                  @{ Uri = 'http://127.0.0.1:62901/api/settings'; Method = 'Get' },
                  @{ Uri = 'http://127.0.0.1:62901/hubs/logs/negotiate?negotiateVersion=1'; Method = 'Post' },
                  @{ Uri = 'http://127.0.0.1:62904/settings'; Method = 'Get' }
              )) {
                  $response = Invoke-WebRequest @probe -SkipHttpErrorCheck
                  if ($response.StatusCode -ne 200) {
                      throw "Unauthenticated service access failed: $($probe.Uri) returned $($response.StatusCode)."
                  }
              }
              $webHandler = [System.Net.Http.HttpClientHandler]::new()
              $webHandler.AllowAutoRedirect = $false
              $webHandler.ServerCertificateCustomValidationCallback =
                  [System.Net.Http.HttpClientHandler]::DangerousAcceptAnyServerCertificateValidator
              $webClient = [System.Net.Http.HttpClient]::new($webHandler)
              try {
                  $anonymousWeb = $webClient.GetAsync('https://localhost:62899/').GetAwaiter().GetResult()
                  try {
                      if ([int]$anonymousWeb.StatusCode -ne 200) {
                          throw 'The Web UI did not load without signing in.'
                      }
                  } finally {
                      $anonymousWeb.Dispose()
                  }
              } finally {
                  $webClient.Dispose()
              }
              $settings = Invoke-RestMethod 'http://127.0.0.1:62901/api/settings'
              if ($null -eq $settings.FileExtensionFilter) {
                  throw 'The API cannot retrieve Agent settings.'
              }
              $hub = Invoke-RestMethod -Method Post 'http://127.0.0.1:62901/hubs/logs/negotiate?negotiateVersion=1'
              if (-not $hub.connectionToken) {
                  throw 'API live-log hub negotiation failed.'
              }
          } finally {
              $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /L*v `"$uninstallLog`"" -Wait -PassThru
              if ($uninstall.ExitCode -notin 0, 3010) {
                  throw "MSI uninstall failed (exit code $($uninstall.ExitCode)). See uninstall.log."
              }
          }
          $remaining = Get-Service -Name 'Serial2CNC.*' -ErrorAction SilentlyContinue
          if ($remaining) {
              throw 'Uninstall left Serial2CNC services registered.'
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v6
        with:
          name: Serial2CNC-${{ steps.version.outputs.full_version }}-win-x64
          path: |
            artifacts\installer\*.msi
            artifacts\installer\*.sha256
            artifacts\installer\setup-services.ps1
          if-no-files-found: error

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installer-logs
          path: artifacts\installer\*.log
          if-no-files-found: ignore
