name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ''
      version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  version:
    name: Resolve and test version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore GitVersion
        run: dotnet tool restore

      - name: Test version handling
        shell: pwsh
        run: ./.github/scripts/Test-Version.ps1

      - name: Calculate version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./.github/scripts/Get-Version.ps1 -Version $env:REQUESTED_VERSION -GitHubOutput

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    needs: version
    env:
      VersionPrefix: ${{ needs.version.outputs.version }}
      VersionSuffix: ${{ needs.version.outputs.version_suffix }}
      ProductVersion: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore cross-platform projects
        run: dotnet restore Serial2CNC.CrossPlatform.slnf

      - name: Build cross-platform projects
        run: dotnet build Serial2CNC.CrossPlatform.slnf --configuration Release --no-restore

      - name: Test cross-platform projects
        run: dotnet test Serial2CNC.CrossPlatform.slnf --configuration Release --no-build --verbosity normal

  windows-desktop:
    name: Windows desktop
    needs: version
    runs-on: windows-latest
    env:
      VersionPrefix: ${{ needs.version.outputs.version }}
      VersionSuffix: ${{ needs.version.outputs.version_suffix }}
      ProductVersion: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore WPF desktop app
        run: dotnet restore Serial2CNC/Serial2CNC.csproj

      - name: Build WPF desktop app
        run: dotnet build Serial2CNC/Serial2CNC.csproj --configuration Release --no-restore

      - name: Test WPF desktop app
        run: dotnet test Serial2CNC/Serial2CNC.csproj --configuration Release --no-build --verbosity normal
