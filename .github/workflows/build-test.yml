name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Serial2CNC.slnx

      - name: Build
        run: dotnet build Serial2CNC.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Serial2CNC.slnx --configuration Release --no-build --verbosity normal
