services:
  web:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    entrypoint: []
    volumes:
      - ./:/src
    command:
      - dotnet
      - watch
      - run
      - --project
      - Serial2CNC.Web/Serial2CNC.Web.csproj
      - --no-launch-profile
      - --urls
      - http://0.0.0.0:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
