services:
  web:
    build:
      context: .
      dockerfile: Serial2CNC.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataDirectory: /data
    ports:
      - "62899:8080"
    volumes:
      - settings:/data
      - type: bind
        source: ${CNC_PROGRAMS_DIRECTORY:-./programs}
        target: /programs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  settings:
